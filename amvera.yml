# Amvera: Python + stdlib static server (site/ via server.py).
# Docs: https://docs.amvera.ru/applications/environments/python-pip.html
# Use 8080 — binding privileged port 80 in the container causes 503.
meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"

run:
  # Amvera does not always inject PORT; pin it so the app matches containerPort.
  command: env PORT=8080 python3 -u server.py
  containerPort: 8080
